<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transactions | Personal Finance</title>

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/transactions.css">

    <script type="module" src="./js/transactions.js"></script>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">₿</div>
            <span>Finance</span>
        </div>

        <nav class="navigation">

            <a href="./index.html" class="nav-item">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="./transactions.html" class="nav-item active">
                <span>↕</span>
                Transactions
            </a>

            <a href="./budgets.html" class="nav-item">
                <span>◫</span>
                Budgets
            </a>

            <a href="./analytics.html" class="nav-item">
                <span>◩</span>
                Analytics
            </a>

            <a href="./settings.html" class="nav-item">
                <span>⚙</span>
                Settings
            </a>

        </nav>
    </aside>

  <nav class="mobile-nav">

    <a href="./index.html">
        <span>⌂</span>
        <small>Home</small>
    </a>

    <a href="./transactions.html">
        <span>↕</span>
        <small>Transactions</small>
    </a>

    <a href="./budgets.html">
        <span>◫</span>
        <small>Budgets</small>
    </a>

    <a href="./analytics.html">
        <span>◩</span>
        <small>Analytics</small>
    </a>

    <a href="./settings.html">
        <span>⚙</span>
        <small>Settings</small>
    </a>

  </nav>


    <main class="main-content">

        <header class="topbar">

            <div>
                <p class="eyebrow">PERSONAL FINANCE</p>
                <h1>Transactions</h1>
            </div>

            <button
                id="addTransactionButton"
                class="primary-button"
            >
                + Add Transaction
            </button>

        </header>


        <section class="transaction-toolbar">

            <div class="search-wrapper">
                <span>⌕</span>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search transactions..."
                >
            </div>


            <select id="typeFilter">
                <option value="all">All types</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>


            <select id="categoryFilter">
                <option value="all">All categories</option>
            </select>


            <select id="sortFilter">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="highest">Highest amount</option>
                <option value="lowest">Lowest amount</option>
            </select>

        </section>


        <section class="panel">

            <div class="panel-header">

                <div>
                    <p class="eyebrow">ACTIVITY</p>
                    <h3>Transaction History</h3>
                </div>

                <span id="transactionCount">
                    0 transactions
                </span>

            </div>


            <div class="transaction-table-wrapper">

                <table class="transaction-table">

                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody id="transactionTableBody">
                    </tbody>

                </table>

            </div>


            <div
                id="transactionEmpty"
                class="empty-state"
            >
                No transactions found.
            </div>

        </section>

    </main>

</div>


<!-- Transaction Modal -->

<div
    id="transactionModal"
    class="modal hidden"
>

    <div class="modal-overlay" id="modalOverlay"></div>

    <div class="modal-card">

        <div class="modal-header">

            <div>
                <p class="eyebrow">TRANSACTION</p>
                <h2 id="modalTitle">
                    Add Transaction
                </h2>
            </div>

            <button
                id="closeModal"
                class="close-button"
            >
                ×
            </button>

        </div>


        <form id="transactionForm">

            <input
                type="hidden"
                id="transactionId"
            >


            <div class="form-group">

                <label>Type</label>

                <div class="type-selector">

                    <button
                        type="button"
                        class="type-option active"
                        data-type="expense"
                    >
                        Expense
                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="income"
                    >
                        Income
                    </button>

                </div>

                <input
                    type="hidden"
                    id="transactionType"
                    value="expense"
                >

            </div>


            <div class="form-group">

                <label for="amount">
                    Amount
                </label>

                <input
                    id="amount"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="25000"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    required
                >

                    <option value="">
                        Select category
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Health">
                        Health
                    </option>

                    <option value="Subscription">
                        Subscription
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Freelance">
                        Freelance
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Gift">
                        Gift
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <input
                    id="description"
                    type="text"
                    maxlength="100"
                    placeholder="Makan siang"
                    required
                >

            </div>


            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    id="date"
                    type="date"
                    required
                >

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    id="cancelButton"
                    class="secondary-button"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Save Transaction
                </button>

            </div>

        </form>

    </div>

</div>


<div id="toast" class="toast"></div>

</body>
</html>
